name: Stack auto PR

# Авто-PR интеграционной ветки стека в main.
#
# Соглашение (CLAUDE.md, «Релиз и pull request'ы»): шаги стека NNN-prK
# вливаются в ветку stack/NNN, и только её PR в main является точкой релиза
# изменений — на нём гоняются heavy тесты. Открывать этот PR руками легко
# забыть, а пока его нет, собранный стек не виден ни ревьюеру, ни CI.
#
# Этот workflow открывает его сам: как только в stack/NNN влит первый шаг,
# появляется черновик stack/NNN → main. Дальнейшие слияния в ту же ветку
# видят открытый PR и ничего не делают — PR просто растёт вместе со стеком.
# Триггер — именно слияние PR, поэтому прямой push в stack/NNN (ребейз,
# правка руками) авто-PR не открывает: в таком режиме его заводят сами.
#
# Почему ЧЕРНОВИК. PR, созданный под GITHUB_TOKEN, проверок не запускает:
# событий workflow этот токен не порождает (исключения — workflow_dispatch
# и repository_dispatch), а в публичном репозитории вместо прогона заводится
# пустая заготовка в состоянии action_required, ждущая ручного подтверждения.
# Черновик делает это честным состоянием, а не сюрпризом: heavy на черновиках
# выключены (job decide в ci.yml), и весь набор проверок, включая heavy,
# стартует один раз — когда человек снимает черновик кнопкой «Ready for
# review» (тип события ready_for_review в ci.yml). Это ровно тот момент,
# когда стек готов к слиянию, ради которого heavy и разводились с unit.
#
# ПРЕДУСЛОВИЕ. Создавать PR под GITHUB_TOKEN GitHub по умолчанию запрещает,
# и одних permissions ниже мало: нужна галка «Allow GitHub Actions to create
# and approve pull requests» (Settings → Actions → General → Workflow
# permissions, репозитория или организации). Без неё шаг падает с внятной
# ошибкой — см. его последний блок.
#
# Пару этому workflow составляет stack-branch.yml: он создаёт саму ветку
# stack/NNN и переводит на неё базу PR шага.

on:
  pull_request:
    types: [closed]

# Один авто-PR на ветку стека: если два шага стека слиты почти одновременно,
# вторая проверка «PR уже открыт?» должна увидеть результат первой, а не
# гнаться с ней за создание дубля. Группа — по ветке стека, а не по PR.
concurrency:
  group: stack-auto-pr-${{ github.base_ref }}
  cancel-in-progress: false

# issues: read — за заголовком задачи NNN для заголовка PR. Заданный блок
# обнуляет все неперечисленные скоупы, поэтому скоуп указан явно.
permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  open-stack-pr:
    name: Open stack PR to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Только слитый (не просто закрытый) PR в ветку стека.
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.base_ref, 'stack/')
    steps:
      - name: Ensure stack PR to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          STACK_BRANCH: ${{ github.base_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          stack_id="$(printf '%s' "$STACK_BRANCH" | sed -nE 's|^stack/([0-9]+)$|\1|p')"
          if [ -z "$stack_id" ]; then
            echo "База '$STACK_BRANCH' не ветка стека (stack/NNN) — авто-PR не нужен."
            exit 0
          fi

          # У PR из форка GITHUB_TOKEN read-only независимо от permissions
          # выше — создать PR он не сможет. Предупреждаем вместо глухого 403:
          # иначе стек из форков молча остался бы без интеграционного PR.
          if [ "$SAME_REPO" != "true" ]; then
            echo "::warning::Шаг #${MERGED_PR} влит из форка, токен read-only —" \
                 "PR ${STACK_BRANCH} → main нужно открыть руками."
            exit 0
          fi

          # Смотрим и закрытые PR: если человек осознанно закрыл PR стека,
          # пересоздавать его на следующем слиянии шага — навязчивость.
          # После слияния (MERGED) новый PR, наоборот, уместен: стек продолжили.
          prs="$(gh pr list --repo "$REPO" --base main --head "$STACK_BRANCH" \
            --state all --limit 30 --json url,state,createdAt)"
          last_state="$(printf '%s' "$prs" | jq -r 'sort_by(.createdAt) | (last // {}) | .state // empty')"
          last_url="$(printf '%s' "$prs" | jq -r 'sort_by(.createdAt) | (last // {}) | .url // empty')"

          case "$last_state" in
            OPEN)
              echo "PR стека уже открыт: $last_url — ничего не делаем."
              exit 0
              ;;
            CLOSED)
              echo "PR стека $last_url закрыт вручную — не пересоздаём."
              exit 0
              ;;
          esac

          # Стек мог быть уже влит в main, а ветка стека — остаться. Тогда PR
          # был бы пустым, и GitHub отказал бы с 422; не доводим до ошибки.
          # Сравнение может и не ответить — ветку удалили сразу после слияния:
          # это тот же случай «открывать нечего», а не повод ронять job.
          if ! ahead="$(gh api "repos/$REPO/compare/main...$STACK_BRANCH" --jq .ahead_by 2>/dev/null)" \
            || [ -z "$ahead" ]; then
            echo "Не удалось сравнить $STACK_BRANCH с main (ветки уже нет?) — авто-PR пропущен."
            exit 0
          fi
          if [ "$ahead" -eq 0 ]; then
            echo "Ветка $STACK_BRANCH не опережает main — открывать нечего."
            exit 0
          fi

          # Заголовок задачи NNN — чтобы PR стека читался списком, а не номером.
          # Задачи может не быть (ветка стека заведена под внешний номер) —
          # тогда обходимся номером, но говорим об этом в логе.
          if ! issue_title="$(gh issue view "$stack_id" --repo "$REPO" --json title --jq .title 2>/dev/null)"; then
            issue_title=""
            echo "Задача #${stack_id} недоступна — заголовок PR только с номером."
          fi
          if [ -n "$issue_title" ]; then
            title="Стек #${stack_id}: ${issue_title}"
          else
            title="Стек #${stack_id}"
          fi

          {
            printf 'Интеграционный PR стека `%s` → `main`. Открыт автоматически\n' "$STACK_BRANCH"
            printf 'после слияния #%s — дальнейшие шаги стека доедут в него сами.\n\n' "$MERGED_PR"
            printf 'Пока это **черновик**, heavy тесты не гоняются. Когда стек собран —\n'
            printf '«Ready for review»: это и запускает полный набор проверок, один раз\n'
            printf 'на весь стек.\n\n'
            printf 'Задача: #%s\n\n' "$stack_id"
            printf 'Описание перед слиянием стоит дописать руками: что стек делает целиком\n'
            printf 'и закрывает ли он задачу (`Closes #%s` автоматикой намеренно не\n' "$stack_id"
            printf 'проставлен).\n\n'
            printf -- '---\n\n'
            printf 'Подробности — раздел «Релиз и pull request'"'"'ы» в `CLAUDE.md`.\n'
          } > /tmp/stack-pr-body.md

          # --head здесь обязателен: он же отключает попытки gh запушить ветку
          # или форкнуть репозиторий, которых в CI без чекаута быть не может.
          if ! pr_url="$(gh pr create --repo "$REPO" \
            --base main --head "$STACK_BRANCH" --draft \
            --title "$title" --body-file /tmp/stack-pr-body.md 2>/tmp/stack-pr-err.txt)"; then
            cat /tmp/stack-pr-err.txt >&2
            if grep -q 'not permitted to create or approve pull requests' /tmp/stack-pr-err.txt; then
              echo "::error::Actions запрещено создавать PR. Включить: Settings → Actions →" \
                   "General → Workflow permissions → «Allow GitHub Actions to create and" \
                   "approve pull requests» (галка есть и у репозитория, и у организации —" \
                   "организационная перекрывает). Пока её нет, PR стека открывается руками."
            fi
            exit 1
          fi
          echo "Открыт черновик PR стека: $pr_url"

          gh pr comment "$MERGED_PR" --repo "$REPO" \
            --body "Стек собирается: открыт черновик интеграционного PR ${pr_url}. Следующие шаги стека вливаются в \`${STACK_BRANCH}\` и доедут в него сами."
