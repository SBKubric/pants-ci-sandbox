name: Stack branch

# Автоматизация интеграционных веток для stacked PR.
#
# Соглашение: работа по задаче NNN режется на цепочку PR из веток NNN-prK.
# Все они вливаются не в main, а в интеграционную ветку стека stack/NNN
# ("форк мейна"), и только её PR в main запускает heavy тесты.
#
# Этот workflow снимает с разработчика (и с агента) ручную работу: если PR из
# ветки NNN-prK открыт на main, ветка stack/NNN создаётся от актуального main
# (если её ещё нет), а база PR переводится на неё.
#
# Ветку стека можно создать и руками:
#   git fetch origin main && git push origin origin/main:refs/heads/stack/NNN

on:
  pull_request:
    # synchronize — самолечение: если ретаргет однажды упал (гонка с другим
    # PR стека, сбой API), следующий пуш в PR запускает его снова. Если база
    # уже переведена, job скипается условием ниже — лишнего вреда нет.
    types: [opened, reopened, synchronize, edited]

# Не больше одного ретаргета на PR одновременно: быстрые подряд события
# (например synchronize сразу после opened) не должны гоняться параллельно
# и создавать ветку стека дважды.
concurrency:
  group: stack-branch-${{ github.event.pull_request.number }}

permissions:
  contents: write
  pull-requests: write

jobs:
  retarget:
    name: Retarget stacked PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Только PR, открытые на main из ветки-участника стека (NNN-prK) и из
    # ветки того же репозитория: у PR из форка GITHUB_TOKEN read-only
    # независимо от permissions выше — ретаргет невозможен, молча пропускаем.
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Retarget to stack branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          stack_id="$(printf '%s' "$HEAD_REF" | sed -nE 's|^([0-9]+)-pr[0-9]+(-.*)?$|\1|p')"
          if [ -z "$stack_id" ]; then
            echo "Ветка '$HEAD_REF' не участник стека (NNN-prK) — PR остаётся на main."
            exit 0
          fi

          stack_branch="stack/${stack_id}"

          if gh api "repos/$REPO/git/ref/heads/$stack_branch" >/dev/null 2>&1; then
            echo "Ветка $stack_branch уже существует."
          else
            main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
            # Устойчиво к гонке: если два PR одного стека открылись одновременно,
            # оба могли увидеть отсутствие ветки. Создание вернёт 422 второму —
            # тогда просто перепроверяем: ветка появилась параллельно — успех,
            # не появилась — падаем как раньше (set -e довершит работу).
            gh api "repos/$REPO/git/refs" \
              -f "ref=refs/heads/$stack_branch" \
              -f "sha=$main_sha" >/dev/null 2>&1 \
              || gh api "repos/$REPO/git/ref/heads/$stack_branch" >/dev/null
            echo "Создана ветка $stack_branch от main ($main_sha)."
          fi

          gh pr edit "$PR" --repo "$REPO" --base "$stack_branch"

          {
            printf 'База PR переведена с `main` на ветку стека `%s`.\n\n' "$stack_branch"
            printf 'Так на stacked PR гоняются только линтеры и юнит-тесты (по диффу PR).\n'
            printf 'Heavy тесты (testcontainers, живые gRPC/HTTP сервисы) запустятся один раз —\n'
            printf 'на PR `%s` → `main`, когда стек будет готов к слиянию.\n\n' "$stack_branch"
            printf 'Подробности — раздел «Релиз и pull request'"'"'ы» в `CLAUDE.md`.\n\n'
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/stack-comment.md

          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/stack-comment.md
